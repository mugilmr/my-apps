<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paisa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Paisa Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a bento dashboard of solid colour tiles over white chart cards, one page per money question. */
:root{
  --ink:#1B1530; --ink2:#4A4466; --muted:#6F688A; --paper:#F5F2FB; --card:#FFFFFF; --line:#E7E1F3;
  --coral:#FF6B3D; --mint:#2BB673; --sky:#1F6FEB; --sun:#F6B511; --violet:#7B4DFF; --pink:#F2459B; --cyan:#14C4D6; --red:#E5383B; --lime:#9BC53D; --slate:#8A91A6;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px; --shadow:0 1px 0 rgba(27,21,48,.04),0 10px 26px -14px rgba(63,38,140,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:500 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100%}
h1,h2,h3,b.num{font-family:var(--display)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.ico{width:18px;height:18px;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(245,242,251,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font:800 20px var(--display);letter-spacing:-.02em;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:8px;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:700;color:var(--ink2);white-space:nowrap}
.tab:hover{background:rgba(123,77,255,.1)}
.tab[aria-current="page"]{background:var(--ink);color:#fff}
.sync{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.sync.saving i{background:var(--sun)} .sync.local i{background:var(--slate)} .sync.error i{background:var(--red)}
.icon{border:0;background:#fff;border:1px solid var(--line);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon:hover{background:#EFE9FF}
.icon.sm{width:32px;height:32px;border-radius:10px}
.icon.danger:hover{background:#FFE3E3;color:var(--red)}

/* page */
main{padding:22px 0 80px}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
.phead h1{font-size:clamp(28px,4.2vw,40px);font-weight:800;line-height:1.05}
.phead .eyebrow{display:block;font:700 13px var(--body);color:var(--muted);margin-bottom:4px}
.phead .sp{flex:1}
.mnav{display:flex;align-items:center;gap:6px}
.mnav .now{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 12px;height:38px;font-weight:700}
.btn{border:0;background:var(--ink);color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#2c2350}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#EFE9FF}
.btn.pop{background:var(--violet)} .btn.pop:hover{background:#6a3df0}
.btn.sm{padding:7px 12px;border-radius:11px;font-size:13px}
.btn.green{background:var(--mint);color:var(--ink)} .btn.green:hover{background:#25a367}
.btn.amber{background:var(--sun);color:var(--ink)} .btn.amber:hover{background:#e3a508}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--sun);color:var(--ink);padding:10px 0;font-weight:600}
.banner .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.alert{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#FFE9E7;border:1px solid #FFC9C4;color:#7a1414;border-radius:16px;padding:12px 16px;margin-bottom:16px;font-weight:600}
.alert button{margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:900px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch h2{font-size:20px;font-weight:700}
.ch small{color:var(--muted);font-weight:600}
.ch .sp{flex:1}
.scroll{overflow-x:auto}
.scroll svg{min-width:560px}
svg.chart{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:600 11px var(--body)}
.ax.now{fill:var(--ink);font-weight:800}
.vl{fill:var(--ink);font:700 11px var(--body)}
.today-col{fill:rgba(123,77,255,.09)}
.hit{fill:transparent}.hit:hover{fill:rgba(27,21,48,.06)}
.avgl{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.bdl{stroke:var(--mint);stroke-width:2;stroke-dasharray:2 4;stroke-linecap:round}
.ln{paint-order:stroke;stroke:#fff;stroke-width:4px;font:700 11px var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;color:var(--ink2);font-size:13px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2px dashed var(--ink)} .sw.g{border-color:var(--mint)}
.anim .seg{animation:grow .55s cubic-bezier(.2,.7,.2,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
.anim .donut{animation:pop .5s ease backwards}
@keyframes grow{from{transform:scaleY(.05)}}
@keyframes pop{from{opacity:.2;transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin:0 0 16px}
.tile{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 20px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:150px}
.tile::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2);pointer-events:none}
.tile::before{content:"";position:absolute;right:30px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.tile[role=link]{cursor:pointer;transition:transform .15s}
.tile[role=link]:hover{transform:translateY(-3px)}
.tile .lbl{font-weight:700;font-size:13px;letter-spacing:.01em;opacity:.9}
.tile b.num{font-size:clamp(28px,3.2vw,36px);font-weight:800;line-height:1.1;letter-spacing:-.02em}
.tile .sub{margin:0;font-weight:600;font-size:13px;display:flex;align-items:center;gap:4px;opacity:.92}
.tile .mini{display:flex;gap:14px;margin-top:auto;padding-top:10px;flex-wrap:wrap;position:relative;z-index:1}
.tile .mini span{display:flex;flex-direction:column;font-size:12px;font-weight:600;opacity:.95}
.tile .mini b{font-size:15px;font-weight:800}
.t-coral{background:var(--coral);color:var(--ink)}
.t-violet{background:var(--violet);color:#fff}
.t-sun{background:var(--sun);color:var(--ink)}
.t-mint{background:var(--mint);color:var(--ink)}
.t-sky{background:var(--sky);color:#fff}
.t-ink{background:var(--ink);color:#fff}
.t-pink{background:var(--pink);color:var(--ink)}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.28);position:relative;margin:8px 0 2px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:#fff}
.meter u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px;text-decoration:none}
.meter.over i{background:#FFD0D0}

/* chips & form bits */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--c) 17%,#fff);color:var(--ink);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pick{position:relative;cursor:pointer}
.pick input{position:absolute;opacity:0;inset:0;cursor:pointer}
.pick span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 10px;border-radius:99px;font-weight:700;font-size:13.5px;background:#fff;border:1.5px solid var(--line)}
.pick span i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick input:checked + span{background:var(--c);border-color:var(--c);color:var(--ink)}
.pick input:checked + span i{background:var(--ink)}
.pick input:focus-visible + span{outline:3px solid var(--violet);outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px;color:var(--ink2);min-width:0}
.fld i{font-style:normal;font-weight:500;color:var(--muted)}
.fld input,.fld select{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:600;color:var(--ink);min-width:0;width:100%}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(123,77,255,.18)}
.err{color:var(--red);font-weight:700;margin:0;min-height:0}
.search{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;min-width:200px;font-weight:600}

/* quick add */
.qa{display:grid;grid-template-columns:150px 1fr;gap:14px 16px;align-items:end}
.qa .amt input{font:800 26px var(--display);padding:8px 12px}
.qa .rest{display:grid;grid-template-columns:1fr 160px auto;gap:12px;align-items:end}
.qa .cats{grid-column:1/-1}
@media (max-width:760px){.qa{grid-template-columns:1fr}.qa .rest{grid-template-columns:1fr}.qa .rest .btn{justify-content:center}}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,#fff);color:var(--ink)}
.li .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted);font-weight:600}
.li .a{font-weight:800;text-align:right;white-space:nowrap}
.li .a small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-weight:600;padding:18px 0;text-align:center}
.due{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;background:#EEE9F8;color:var(--ink2)}
.due.late{background:var(--red);color:#fff}.due.soon{background:var(--sun);color:var(--ink)}.due.ok{background:#D5F3E4;color:#0b5a35}.due.later{background:#E2ECFF;color:#1747a6}

/* donut legend */
.donutwrap{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:16px;align-items:center}
@media (max-width:520px){.donutwrap{grid-template-columns:1fr}}
.cl{display:flex;flex-direction:column;gap:7px;font-size:13.5px;font-weight:600}
.cl div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.cl i{width:12px;height:12px;border-radius:4px}
.cl em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}

/* expenses page */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.fchip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.fchip.addcat{border-style:dashed;color:var(--ink2)}
.fchip.addcat svg{width:12px;height:12px}
.cattools .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cattools .row i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.cattools .row b{flex:1}
.cattools .row small{color:var(--ink2);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{position:relative;cursor:pointer}.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}
.swatches span{display:block;width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.swatches input:checked + span{box-shadow:0 0 0 3px var(--ink)}
.swatches input:focus-visible + span{outline:3px solid var(--violet);outline-offset:2px}
.newcat{margin-top:10px}
.fchip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--ink)}
.fchip[aria-pressed="true"]:not([style]){color:#fff}
.fchip[aria-pressed="true"]:not([style]) i{background:#fff}
.dayh{display:flex;justify-content:space-between;gap:12px;font:700 13px var(--body);color:var(--muted);padding:16px 0 6px;border-bottom:2px solid var(--line)}
.dayh b{color:var(--ink)}
.erow{display:grid;grid-template-columns:130px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.erow .note{font-weight:600;overflow-wrap:anywhere}
.erow .amt{font-weight:800;text-align:right;min-width:90px}
.erow .acts{display:flex;gap:4px}
@media (max-width:620px){.erow{grid-template-columns:1fr auto;grid-template-areas:"c a" "n x"}.erow .chip{grid-area:c;justify-self:start}.erow .amt{grid-area:a}.erow .note{grid-area:n}.erow .acts{grid-area:x}}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:6px}
.stats div{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--muted)}
.stats b{font:800 22px var(--display);color:var(--ink)}

/* payments */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.col h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.col .tot{font-weight:700;color:var(--ink2);margin:0 0 12px}
.pcard{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border-left:8px solid var(--c)}
.pcard.owe{--c:var(--coral)} .pcard.recv{--c:var(--mint)}
.pcard.done{opacity:.72}
.ptop{display:flex;justify-content:space-between;gap:12px}
.ptop h3{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.ptop .sub{margin:2px 0 0;color:var(--muted);font-weight:600;font-size:13px}
.pamt{text-align:right;white-space:nowrap}
.pamt b{font:800 22px var(--display)}
.pamt small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.pbar{height:8px;border-radius:99px;background:#EEE9F8;margin:10px 0 0;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c);border-radius:99px}
.pbot{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.pbot .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.toggle{border:0;background:none;font-weight:700;color:var(--ink2);padding:6px 0;display:flex;align-items:center;gap:6px}

/* investments */
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.icard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:0 0 16px;overflow:hidden;display:flex;flex-direction:column}
.icard .band{background:var(--c);height:10px}
.icard .in{padding:14px 18px 0;display:flex;flex-direction:column;gap:6px}
.itop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.icard h3{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.ival{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ival b{font:800 28px var(--display);letter-spacing:-.02em}
.ret{font-weight:800;font-size:13px;padding:2px 8px;border-radius:99px;display:inline-flex;gap:4px;align-items:center}
.ret.up{background:#D5F3E4;color:#0b5a35}.ret.dn{background:#FFDADA;color:#8d1313}
.icard dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 0}
.icard dt{font-size:11.5px;font-weight:700;color:var(--muted)}
.icard dd{margin:0;font-weight:800;font-size:14px}
.icard .note{font-size:13px;color:var(--ink2);font-weight:600;margin:0}
.icard .acts{display:flex;gap:6px;margin-top:8px;align-items:center}
.hbar{display:grid;grid-template-columns:180px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-weight:700;font-size:13.5px}
.hbar .tr{height:14px;border-radius:99px;background:#F0ECF8;position:relative;overflow:hidden}
.hbar .tr i{position:absolute;top:0;bottom:0;border-radius:99px}
.hbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar span:last-child{text-align:right}
@media (max-width:520px){.hbar{grid-template-columns:100px 1fr 60px}}
.allocbar{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px}
.allocbar i{display:block;height:100%}

/* modal, toast, tooltip */
.scrim{position:fixed;inset:0;background:rgba(27,21,48,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:24px;width:min(480px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px -20px rgba(27,21,48,.6)}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh h2{font-size:24px;font-weight:800}
.mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--ink2)}
.chk input{width:18px;height:18px;accent-color:var(--violet)}
.hr{height:1px;background:var(--line);margin:4px 0}
.csv{width:100%;min-height:200px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:500 12px/1.4 ui-monospace,Menlo,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;padding:11px 14px 11px 18px;border-radius:14px;font-weight:600;box-shadow:0 14px 40px -10px rgba(27,21,48,.7);max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
#toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:5px 11px;font-weight:700}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.5;font-weight:600;box-shadow:0 12px 30px -8px rgba(27,21,48,.6);max-width:240px}
#tip[hidden]{display:none}
#tip b{font-weight:800}
@media (max-width:640px){.top .wrap{flex-wrap:wrap;padding-top:8px;padding-bottom:8px;gap:8px}.brand{flex:1}nav.tabs{order:3;width:100%;flex:none;margin:0}.wrap{padding:0 14px}.sync span{display:none}}

/* iPhone app fixes: no zoom on focus, safe areas, no double-tap zoom */
html{-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
button,.tab,.pick,.fchip,.day,.mood,.tile[role=link]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
#toast{bottom:calc(22px + env(safe-area-inset-bottom))}
textarea.csv{font-size:13px!important}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" hidden></div>
<div id="tip" hidden></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const BASE_CATS=[
 {id:'food',name:'Food',color:'#FF6B3D'},{id:'groceries',name:'Groceries',color:'#2BB673'},
 {id:'transport',name:'Transport',color:'#2D7FF9'},{id:'bills',name:'Bills',color:'#F6B511'},
 {id:'rent',name:'Rent',color:'#7B4DFF'},{id:'shopping',name:'Shopping',color:'#F2459B'},
 {id:'health',name:'Health',color:'#14C4D6'},{id:'fun',name:'Fun',color:'#E5383B'},
 {id:'travel',name:'Travel',color:'#9BC53D'},{id:'other',name:'Other',color:'#8A91A6'}];

const NEW_COLORS=['#E85D04','#0EAD69','#3A86FF','#8338EC','#FF006E','#06B6D4','#B5179E','#6A994E','#D4A017','#5C677D','#F72585','#00A896'];
let CATS=BASE_CATS.slice(),CAT=null;
/* Built-in categories plus the ones you add (saved in core.cats). Unknown ids show as Other. */
function buildCats(extra){CATS=BASE_CATS.concat((extra||[]).filter(c=>c&&c.id&&c.name));const m=Object.fromEntries(CATS.map(c=>[c.id,c]));CAT=new Proxy(m,{get:(t,k)=>t[k]||BASE_CATS[9]})}
buildCats();
const INV=[
 {id:'stocks',name:'Stocks',color:'#2D7FF9'},{id:'mf',name:'Mutual fund',color:'#7B4DFF'},
 {id:'fd',name:'Fixed deposit',color:'#F6B511'},{id:'gold',name:'Gold',color:'#FF6B3D'},
 {id:'ppf',name:'PPF / EPF',color:'#2BB673'},{id:'crypto',name:'Crypto',color:'#F2459B'},
 {id:'property',name:'Real estate',color:'#14C4D6'},{id:'other',name:'Other',color:'#8A91A6'}];
const INVT=Object.fromEntries(INV.map(c=>[c.id,c]));
const CUR={INR:{loc:'en-IN',sym:'₹'},USD:{loc:'en-US',sym:'$'},EUR:{loc:'de-DE',sym:'€'},GBP:{loc:'en-GB',sym:'£'}};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PAGES=['dashboard','expenses','payments','investments'];
const LS_KEY='paisa-palette-v1';

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const monthOf=s=>s.slice(0,7);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addMonths=(m,n)=>{const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dim=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const mLabel=m=>MONF[Number(m.slice(5))-1]+' '+m.slice(0,4);
const mShort=m=>MON[Number(m.slice(5))-1];
const fmtDate=s=>{const d=parse(s);const y=d.getFullYear()!==new Date().getFullYear();return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+(y?' '+d.getFullYear():'')};
const fmtShort=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const r2=n=>Math.round(n*100)/100;
function stable(o){if(Array.isArray(o))return o.map(stable);if(o&&typeof o==='object'){const r={};Object.keys(o).sort().forEach(k=>{r[k]=stable(o[k])});return r}return o}
const same=(a,b)=>JSON.stringify(stable(a))===JSON.stringify(stable(b));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const cur=()=>state.core.settings.currency;
const sym=()=>CUR[cur()].sym;
function money(n){n=r2(n||0);const frac=Math.abs(n%1)>0.004;return new Intl.NumberFormat(CUR[cur()].loc,{style:'currency',currency:cur(),minimumFractionDigits:frac?2:0,maximumFractionDigits:frac?2:0}).format(n)}
function compact(n){const a=Math.abs(n),s=n<0?'-':'',y=sym();const t=v=>v.toFixed(1).replace(/\.0$/,'');
  if(cur()==='INR'){if(a>=1e7)return s+y+t(a/1e7)+'Cr';if(a>=1e5)return s+y+t(a/1e5)+'L'}
  else if(a>=1e6)return s+y+t(a/1e6)+'M';
  if(a>=1e3)return s+y+(a>=1e4?Math.round(a/1e3):t(a/1e3))+'k';
  return s+y+Math.round(a)}
function niceMax(v){if(v<=0)return 100;const q=v/4,p=Math.pow(10,Math.floor(Math.log10(q))),f=q/p;const st=[1,1.5,2,2.5,3,4,5,6,8,10].find(x=>x>=f-1e-9)||10;return st*p*4}

const ICONS={plus:'M12 5v14M5 12h14',edit:'M4 20h4L19 9l-4-4L4 16v4z',trash:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',check:'M5 12l5 5L20 7',left:'M15 5l-7 7 7 7',right:'M9 5l7 7-7 7',gear:'M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4',x:'M6 6l12 12M18 6L6 18',copy:'M9 9h11v11H9zM5 15V4h11',up:'M12 19V5M6 11l6-6 6 6',down:'M12 5v14M6 13l6 6 6-6',refresh:'M20 11a8 8 0 1 0-2 6M20 4v7h-7',coin:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4'};
const ico=n=>`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;

/* ---------- state + storage ---------- */
const ui={page:'dashboard',month:monthOf(today()),filterCats:[],q:'',invType:'all',settled:{owe:false,recv:false},lastCat:'food',animate:true,sync:'saved'};
let state={core:null,exp:{}};
let cloud=null, dirty=new Set(), flushTimer=null, flushing=false, firstSnap=true;

function blankCore(){return{v:1,sample:false,settings:{currency:'INR',budget:30000},payments:[],investments:[],cats:[]}}
function monthDoc(m){if(!state.exp[m])state.exp[m]={items:[]};return state.exp[m]}
function getDoc(n){return n==='core'?state.core:(state.exp[n.slice(4)]||null)}
function setDoc(n,d){if(n==='core'){state.core=Object.assign(blankCore(),d);state.core.settings=Object.assign(blankCore().settings,d.settings||{});state.core.payments=d.payments||[];state.core.investments=d.investments||[];state.core.cats=d.cats||[];buildCats(state.core.cats)}else if(n.indexOf('exp_')===0){state.exp[n.slice(4)]={items:(d.items||[])}}}
const docNames=()=>['core'].concat(Object.keys(state.exp).map(m=>'exp_'+m));
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function touch(){for(const n of arguments)dirty.add(n);saveLocal();scheduleFlush();render()}
function scheduleFlush(){if(!cloud)return;setSync('saving');clearTimeout(flushTimer);flushTimer=setTimeout(flush,500)}
async function flush(){
  if(flushing||!cloud)return;flushing=true;
  try{
    while(dirty.size){
      const n=dirty.values().next().value;dirty.delete(n);
      const d=getDoc(n);if(!d)continue;
      try{await cloud.doc(n).set(clone(d))}catch(e){dirty.add(n);throw e}
    }
    setSync('saved');
  }catch(e){setSync('error')}
  finally{flushing=false}
}
function setSync(s){ui.sync=s;const el=document.getElementById('syncpill');if(el)el.outerHTML=syncPill()}

async function initCloud(){
  const timer=setTimeout(()=>{if(!cloud)setSync('local')},10000);
  try{
    if(!window.claude||!window.claude.use){setSync('local');return}
    const db=await window.claude.use('db'),user=await window.claude.use('user');
    const id=user?await user.id():null;
    if(!db||!id){clearTimeout(timer);setSync('local');return}
    const col=db.collection('data/users/'+id);
    cloud=col;
    col.onSnapshot(snap=>{
      if(snap.metadata.fromCache&&snap.empty)return;
      clearTimeout(timer);
      if(firstSnap){
        firstSnap=false;
        if(snap.empty){docNames().forEach(n=>dirty.add(n));setSync('saving');flush();return}
        state={core:null,exp:{}};
      }
      let changed=false;
      snap.docChanges().forEach(ch=>{
        if(ch.type==='removed'||ch.doc.metadata.hasPendingWrites)return;
        const n=ch.doc.id,data=clone(ch.doc.data());
        if(dirty.has(n))return;
        if(!same(getDoc(n),data)){setDoc(n,data);changed=true}
      });
      if(!state.core)state.core=blankCore();
      if(changed){saveLocal();render()}
      setSync(dirty.size||flushing?'saving':'saved');
    },()=>{cloud=null;setSync('local')});
  }catch(e){setSync('local')}
}

/* ---------- sample data ---------- */
function sampleExp(){
  const r=rng(42),out={},t=today(),start=addDays(t,-165);let k=0;
  const P={
    food:[['Lunch',80,220],['Filter coffee',30,70],['Dinner out',200,520],['Food delivery',150,380],['Tea & snacks',30,90],['Breakfast',40,110]],
    groceries:[['Vegetables',120,420],['Milk & curd',60,160],['Supermarket run',500,1600],['Fruits',100,350]],
    transport:[['Metro top-up',200,500],['Auto fare',50,220],['Bike petrol',150,500],['Cab ride',120,480]],
    shopping:[['T-shirt',499,999],['Online order',300,1500],['Earphones',699,1499]],
    health:[['Pharmacy',80,600],['Gym',800,1200]],
    fun:[['Movie tickets',250,700],['Music subscription',119,119],['Game night',200,900]],
    travel:[['Bus ticket home',350,900],['Train ticket',300,1100]],
    other:[['Haircut',150,350],['Gift',300,1500]]};
  const add=(d,cat,note,amt)=>{const m=monthOf(d);(out[m]=out[m]||{items:[]}).items.push({id:'s'+(k++),d,amt:Math.round(amt),cat,note,ts:k})};
  const pick=(cat)=>{const p=P[cat][Math.floor(r()*P[cat].length)];return[p[0],p[1]+r()*(p[2]-p[1])]};
  for(let d=start;d<=t;d=addDays(d,1)){
    const dd=Number(d.slice(8));
    const plan=[['food',.9],['food',.3],['groceries',.1],['transport',.4],['shopping',.035],['health',.04],['fun',.09],['travel',.015],['other',.04]];
    plan.forEach(([c,p])=>{if(r()<p){const [n,a]=pick(c);add(d,c,n,a)}});
    if(dd===1)add(d,'rent','Monthly rent',9000);
    if(dd===5)add(d,'bills','Wi-Fi',799);
    if(dd===8)add(d,'bills','Mobile recharge',299);
    if(dd===12)add(d,'bills','Electricity bill',900+r()*700);
  }
  return out;
}
function sampleCore(){
  const t=today(),r=rng(7);
  const hist=(inv,cur,months)=>{const a=[];for(let j=0;j<=months;j++){const f=j/months;const v=j===months?cur:inv+(cur-inv)*f*(1+(r()-.5)*.5);a.push([addDays(t,-(months-j)*30),Math.round(v)])}return a};
  const mk=(name,type,invested,current,months,sip,note)=>({id:uid(),name,type,invested,current,start:addDays(t,-months*30),sip,note,history:hist(invested,current,months)});
  const c=blankCore();c.sample=true;c.settings.budget=32000;
  c.payments=[
    {id:uid(),kind:'owe',party:'Credit card bill',amount:8400,paid:0,due:addDays(t,4),note:'Statement due',created:1},
    {id:uid(),kind:'owe',party:'Sanjay',amount:2500,paid:1000,due:addDays(t,9),note:'Borrowed for the trip',created:2},
    {id:uid(),kind:'owe',party:'Electricity board',amount:1350,paid:0,due:addDays(t,-2),note:'Late fee after due date',created:3},
    {id:uid(),kind:'recv',party:'Arun',amount:3000,paid:0,due:addDays(t,-5),note:'Lent for train tickets',created:4},
    {id:uid(),kind:'recv',party:'Divya',amount:850,paid:0,due:addDays(t,2),note:'Cab and dinner share',created:5},
    {id:uid(),kind:'recv',party:'Kiran (freelance invoice)',amount:12000,paid:4000,due:addDays(t,12),note:'Second instalment',created:6}];
  c.investments=[
    mk('Nifty 50 index fund','mf',84000,93450,14,5000,'Monthly SIP on the 5th'),
    mk('Large-cap stock basket','stocks',60000,66800,9,0,'Three blue-chip shares'),
    mk('Bank fixed deposit','fd',50000,53100,6,0,'Matures in 18 months'),
    mk('Digital gold','gold',15000,17250,11,1000,''),
    mk('PPF account','ppf',60000,64800,18,0,'Locked until maturity'),
    mk('Bitcoin','crypto',10000,12900,5,0,'Small, high-risk bet')];
  return c;
}
function initState(){
  const l=loadLocal();
  if(l&&l.core){state=l;state.exp=state.exp||{}}
  else{state={core:sampleCore(),exp:sampleExp()};saveLocal()}
}

/* ---------- data selectors ---------- */
const monthItems=m=>(state.exp[m]&&state.exp[m].items)||[];
const openPay=k=>state.core.payments.filter(p=>p.kind===k&&p.amount-p.paid>0.004);
const rem=p=>Math.max(0,p.amount-p.paid);
function findExpense(id){for(const m in state.exp){const i=state.exp[m].items.findIndex(x=>x.id===id);if(i>=0)return{m,i,e:state.exp[m].items[i]}}return null}
function dueInfo(due,settled){
  if(settled)return{cls:'ok',text:'Settled'};
  if(!due)return{cls:'none',text:'No deadline'};
  const n=dayDiff(today(),due);
  if(n<0)return{cls:'late',text:'Overdue by '+(-n)+' day'+(-n>1?'s':'')};
  if(n===0)return{cls:'soon',text:'Due today'};
  if(n===1)return{cls:'soon',text:'Due tomorrow'};
  if(n<=3)return{cls:'soon',text:'Due in '+n+' days'};
  return{cls:'later',text:'Due '+fmtShort(due)}}
function byCat(items){const o={};items.forEach(i=>{o[i.cat]=(o[i.cat]||0)+i.amt});return o}

/* ---------- charts ---------- */
let gid=0;
const tipAttr=h=>` data-tip="${esc(h)}"`;
function donut(entries,centerTop,centerSub,label){
  const total=sum(entries,e=>e.value),S=220,R=82,W=30,C=2*Math.PI*R,cx=S/2;
  let s=`<svg class="chart donut" viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(label)}"><circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="#F0ECF8" stroke-width="${W}"/>`;
  if(total>0){let acc=0;const gap=entries.length>1?2.5:0;
    entries.forEach(e=>{const len=e.value/total*C;if(len<=0)return;
      s+=`<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${e.color}" stroke-width="${W}" stroke-dasharray="${Math.max(.5,len-gap)} ${C-Math.max(.5,len-gap)}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cx})"${tipAttr('<b>'+esc(e.label)+'</b><br>'+money(e.value)+' · '+Math.round(e.value/total*100)+'%')}/>`;acc+=len})}
  s+=`<text x="${cx}" y="${cx+2}" text-anchor="middle" style="font:800 26px var(--display);fill:var(--ink)">${esc(centerTop)}</text><text x="${cx}" y="${cx+22}" text-anchor="middle" class="ax">${esc(centerSub)}</text></svg>`;
  return s}
function spark(vals,color,w,h){
  w=w||260;h=h||56;const id='sg'+(gid++);
  if(vals.length<2)vals=[vals[0]||0,vals[0]||0];
  const mn=Math.min(...vals),mx=Math.max(...vals),span=(mx-mn)||1,pad=6;
  const pts=vals.map((v,i)=>[pad+i*(w-pad*2)/(vals.length-1),h-pad-(v-mn)/span*(h-pad*2)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Value trend"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${line}L${last[0]} ${h}L${pts[0][0]} ${h}Z" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}" stroke="#fff" stroke-width="2"/></svg>`}
function lineChart(points,color,label){
  if(points.length<2)return'<p class="empty">Add a second value update to see the trend.</p>';
  const W=700,H=240,L=52,R=14,T=14,B=28,pw=W-L-R,ph=H-T-B,id='lc'+(gid++);
  const vals=points.map(p=>p.y),mn=Math.min(...vals),mx=Math.max(...vals);
  const lo=0,hi=niceMax(mx*1.04),span=hi-lo||1;
  const X=i=>L+i*pw/(points.length-1),Y=v=>T+ph-(v-lo)/span*ph;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".32"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  for(let i=0;i<=4;i++){const v=lo+span/4*i;s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  const path=points.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  s+=`<path d="${path}L${X(points.length-1)} ${T+ph}L${X(0)} ${T+ph}Z" fill="url(#${id})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  const step=Math.max(1,Math.ceil(points.length/6));
  points.forEach((p,i)=>{
    s+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===points.length-1?5:3}" fill="${color}" stroke="#fff" stroke-width="2"/>`;
    s+=`<rect class="hit" x="${X(i)-pw/points.length/2}" y="${T}" width="${pw/points.length}" height="${ph}"${tipAttr('<b>'+esc(fmtShort(p.x))+'</b><br>'+money(p.y))}/>`;
    if(i%step===0||i===points.length-1)s+=`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(fmtShort(p.x).replace(/ \d{4}$/,''))}</text>`});
  return s+'</svg>'}

function dailyChart(m){
  const n=dim(m),days=Array.from({length:n},()=>({tot:0,c:{}}));
  monthItems(m).forEach(i=>{const o=days[Number(i.d.slice(8,10))-1];if(o){o.tot+=i.amt;o.c[i.cat]=(o.c[i.cat]||0)+i.amt}});
  const budget=+state.core.settings.budget||0,bd=budget?budget/n:0,t=today(),isCur=m===monthOf(t),el=isCur?Number(t.slice(8,10)):n;
  const total=sum(days,d=>d.tot),avg=el?total/el:0;
  const sorted=days.map(d=>d.tot).filter(v=>v>0).sort((a,b)=>a-b),p90=sorted.length?sorted[Math.min(sorted.length-1,Math.floor(sorted.length*.9))]:0;
  const dmax=sorted.length?sorted[sorted.length-1]:0;
  const cap=Math.max(p90*1.3,bd*1.5,avg*2,1),max=niceMax(dmax<=cap*1.35?Math.max(dmax,bd,avg)*1.06:cap);
  const W=700,H=260,L=50,R=12,T=18,B=28,pw=W-L-R,ph=H-T-B,bw=pw/n,barw=Math.max(4,bw*.66),Y=v=>T+ph-Math.min(v,max)/max*ph;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending in ${esc(mLabel(m))}, stacked by category">`;
  for(let i=0;i<=4;i++){const v=max/4*i;s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  days.forEach((d,i)=>{
    const dn=i+1,x=L+i*bw+(bw-barw)/2,isT=isCur&&dn===el;
    if(isT)s+=`<rect class="today-col" x="${L+i*bw}" y="${T}" width="${bw}" height="${ph}" rx="6"/>`;
    let acc=0,tip='<b>'+esc(fmtDate(m+'-'+pad(dn)))+'</b><br>'+(d.tot?money(d.tot):'No spending');
    CATS.forEach(c=>{const v=d.c[c.id];if(!v)return;const top=Math.min(acc+v,max),bot=Math.min(acc,max);if(top>bot)s+=`<rect class="seg" x="${x}" y="${Y(top)}" width="${barw}" height="${(top-bot)/max*ph}" rx="2" fill="${c.color}"/>`;acc+=v;tip+='<br>'+esc(c.name)+' '+money(v)});
    if(d.tot>max)s+=`<text class="vl" x="${x+barw/2}" y="${T-5}" text-anchor="middle">${compact(d.tot)}</text>`;
    s+=`<rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${ph}"${tipAttr(tip)}/>`;

function stackedMonths(end){

function weekdayChart(){
  const t=today(),from=addDays(t,-55),tot=Array(7).fill(0),cnt=Array(7).fill(0);
  for(let d=from;d<=t;d=addDays(d,1))cnt[parse(d).getDay()]++;
  Object.values(state.exp).forEach(x=>x.items.forEach(i=>{if(i.d>=from&&i.d<=t)tot[parse(i.d).getDay()]+=i.amt}));
  const order=[1,2,3,4,5,6,0],cols=['#7B4DFF','#2D7FF9','#14C4D6','#2BB673','#F6B511','#FF6B3D','#F2459B'];
  const avg=order.map(d=>cnt[d]?tot[d]/cnt[d]:0),mx=Math.max(...avg),peak=avg.indexOf(mx),max=niceMax(Math.max(mx,1)*1.12);
  const W=520,H=250,L=48,R=10,T=18,B=28,pw=W-L-R,ph=H-T-B,bw=pw/7,barw=bw*.6,Y=v=>T+ph-v/max*ph;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average spending by weekday over the last eight weeks">`;
  for(let i=0;i<=4;i++){const v=max/4*i;s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  order.forEach((d,i)=>{const x=L+i*bw+(bw-barw)/2,v=avg[i];
    s+=`<rect class="seg" x="${x}" y="${Y(v)}" width="${barw}" height="${Math.max(0,v/max*ph)}" rx="8" fill="${cols[i]}"/>`;

    s+=`<text class="ax${i===peak&&mx>0?' now':''}" x="${x+barw/2}" y="${H-8}" text-anchor="middle">${DOW[d]}</text>`});
  return{svg:s+'</svg>',peak:mx>0?DOW[order[peak]]:null,mx}}

function trendPoints(){
  const invs=state.core.investments,dates=new Set();invs.forEach(v=>(v.history||[]).forEach(h=>dates.add(h[0])));
  return[...dates].sort().map(d=>({x:d,y:sum(invs,v=>{let val=0;(v.history||[]).forEach(h=>{if(h[0]<=d)val=h[1]});return val})}))}
function invCard(v){
  const ty=INVT[v.type]||INVT.other,gain=v.current-v.invested,pct=v.invested?gain/v.invested*100:0,up=gain>=0;
  const mos=Math.max(0,Math.round(dayDiff(v.start,today())/30)),held=mos>=12?(mos/12).toFixed(1).replace(/\.0$/,'')+' yr':mos+' mo';
  return `<article class="icard" style="--c:${ty.color}"><div class="band"></div><div class="in"><div class="itop"><span class="chip" style="--c:${ty.color}"><i></i>${esc(ty.name)}</span><span>Held ${held}</span></div><h3>${esc(v.name)}</h3>
  <div class="ival"><b>${money(v.current)}</b><span class="ret ${up?'up':'dn'}">${ico(up?'up':'down')}${Math.abs(pct).toFixed(1)}%</span></div>
  ${spark((v.history||[]).map(h=>h[1]).concat(v.history&&v.history.length?[]:[v.invested,v.current]),ty.color,280,52)}
  <dl><div><dt>Invested</dt><dd>${money(v.invested)}</dd></div><div><dt>${up?'Gain':'Loss'}</dt><dd>${money(Math.abs(gain))}</dd></div><div><dt>Monthly SIP</dt><dd>${v.sip?money(v.sip):'None'}</dd></div></dl>
  ${v.note?`<p class="note">${esc(v.note)}</p>`:''}
  <div class="acts"><button class="btn sm" data-act="openInvValue" data-id="${v.id}">Update value</button><button class="icon sm" data-act="openInvestment" data-id="${v.id}" aria-label="Edit investment">${ico('edit')}</button><button class="icon sm danger" data-act="delInvestment" data-id="${v.id}" aria-label="Delete investment">${ico('trash')}</button></div></div></article>`}
function viewInvestments(){
  const all=state.core.investments,list=all.filter(v=>ui.invType==='all'||v.type===ui.invType).sort((a,b)=>b.current-a.current);
  const I=sum(all,v=>v.invested),C=sum(all,v=>v.current),G=C-I,P=I?G/I*100:0,sip=sum(all,v=>v.sip||0);
  const tt={};all.forEach(v=>{tt[v.type]=(tt[v.type]||0)+v.current});
  const ent=INV.filter(x=>tt[x.id]).map(x=>({label:x.name,value:tt[x.id],color:x.color}));
  const rets=all.map(v=>({v,p:v.invested?(v.current-v.invested)/v.invested*100:0})).sort((a,b)=>b.p-a.p);
  const maxAbs=Math.max(10,...rets.map(r=>Math.abs(r.p)));
  const tp=trendPoints();
  return `<div class="phead"><div><span class="eyebrow">Each one tracked on its own</span><h1>Investments</h1></div><div class="sp"></div><button class="btn pop" data-act="openInvestment">${ico('plus')}Add investment</button></div>
  <section class="tiles"><article class="tile t-sky"><span class="lbl">Current value</span><b class="num">${money(C)}</b><p class="sub">${all.length} investment${all.length===1?'':'s'}</p></article>
  <article class="tile t-ink"><span class="lbl">Money put in</span><b class="num">${money(I)}</b><p class="sub">${sip?money(sip)+' going in every month':'No monthly SIPs'}</p></article>
  <article class="tile ${G>=0?'t-mint':'t-pink'}"><span class="lbl">${G>=0?'Total gain':'Total loss'}</span><b class="num">${money(Math.abs(G))}</b><p class="sub">${ico(G>=0?'up':'down')} ${Math.abs(P).toFixed(1)}% on what you put in</p></article></section>
  ${all.length?`<div class="grid" style="margin-bottom:16px"><section class="card s4"><div class="ch"><h2>Allocation</h2></div><div class="donutwrap" style="grid-template-columns:1fr">${donut(ent,compact(C),'total value','Allocation by investment type')}<div class="cl">${ent.map(e=>`<div><i style="background:${e.color}"></i><span>${esc(e.label)}<em>${Math.round(e.value/C*100)}%</em></span><b>${money(e.value)}</b></div>`).join('')}</div></div></section>
  <section class="card s8"><div class="ch"><h2>Total value over time</h2><small>Built from each value update</small></div><div class="scroll">${lineChart(tp,'#1F6FEB','Total investment value over time')}</div>
   <div class="ch" style="margin-top:14px"><h2>Return on each</h2></div>${rets.map(({v,p})=>{const w=Math.abs(p)/maxAbs*50;return `<div class="hbar"><span>${esc(v.name)}</span><span class="tr" role="img" aria-label="${esc(v.name)} ${p.toFixed(1)} percent"><i style="${p>=0?`left:50%;width:${w}%;background:var(--mint)`:`right:50%;width:${w}%;background:var(--red)`}"></i></span><span>${p>=0?'+':''}${p.toFixed(1)}%</span></div>`}).join('')}</section></div>
  <div class="toolbar"><div class="fchips" role="group" aria-label="Filter by type"><button class="fchip" data-act="invFilter" data-type="all" aria-pressed="${ui.invType==='all'}">All</button>${INV.filter(x=>tt[x.id]).map(x=>`<button class="fchip" style="--c:${x.color}" data-act="invFilter" data-type="${x.id}" aria-pressed="${ui.invType===x.id}"><i></i>${x.name}</button>`).join('')}</div></div>
  <div class="icards">${list.map(invCard).join('')}</div>`:`<section class="card"><p class="empty">Add each investment separately: a fund, a share, a fixed deposit, gold. You can update its value whenever you check it.</p></section>`}`}

const fld=(label,name,type,val,extra)=>`<label class="fld"><span>${label}</span><input name="${name}" type="${type}" value="${esc(val)}" ${extra||''}></label>`;

      ${owe?`<label class="chk"><input type="checkbox" name="log" checked>Also add it to my expenses</label><div class="fld"><span>Category</span>${catPicker('cat','bills')}</div>`:''}${foot('Save')}</form>`}
  if(kind==='investment'){const v=d.id?state.core.investments.find(x=>x.id===d.id):null;
    h=`<form class="modal" data-form="investment" data-id="${v?v.id:''}" role="dialog" aria-modal="true" aria-labelledby="mt">${head(v?'Edit investment':'Add investment')}${fld('Name','name','text',v?v.name:'','maxlength="60" required autofocus placeholder="e.g. Index fund, Gold, Fixed deposit"')}
      <label class="fld"><span>Type</span><select name="type">${INV.map(x=>`<option value="${x.id}"${v&&v.type===x.id?' selected':''}>${x.name}</option>`).join('')}</select></label>
      <div class="row2">${fld('Money put in','invested','number',v?v.invested:'','step="0.01" min="0" inputmode="decimal" required')}${fld('Worth today','current','number',v?v.current:'','step="0.01" min="0" inputmode="decimal" required')}</div>
      <div class="row2">${fld('Started on','start','date',v?v.start:today(),'required')}${fld('Monthly SIP <i>optional</i>','sip','number',v&&v.sip?v.sip:'','step="0.01" min="0" inputmode="decimal"')}</div>${fld('Note <i>optional</i>','note','text',v?v.note||'':'','maxlength="80"')}${foot(v?'Save changes':'Add investment')}</form>`}
  if(kind==='invvalue'){const v=state.core.investments.find(x=>x.id===d.id);if(!v)return;
    h=`<form class="modal" data-form="invvalue" data-id="${v.id}" role="dialog" aria-modal="true" aria-labelledby="mt">${head('Update value')}<p style="margin:0;color:var(--ink2);font-weight:600">${esc(v.name)} · last value ${money(v.current)}</p>${fld('Worth today','current','number',v.current,'step="0.01" min="0" inputmode="decimal" required autofocus')}${fld('New money added since last time <i>optional</i>','extra','number','','step="0.01" min="0" inputmode="decimal" placeholder="0"')}${fld('As of','d','date',today(),'required')}${foot('Save value')}</form>`}
  if(kind==='settings'){const s=state.core.settings;
    h=`<form class="modal" data-form="settings" role="dialog" aria-modal="true" aria-labelledby="mt">${head('Settings')}<label class="fld"><span>Currency</span><select name="currency">${Object.keys(CUR).map(c=>`<option value="${c}"${s.currency===c?' selected':''}>${CUR[c].sym} ${c}</option>`).join('')}</select></label>${fld('Monthly budget','budget','number',s.budget||'','step="1" min="0" inputmode="numeric"')}<div class="hr"></div>
      <div class="mf" style="justify-content:flex-start"><button type="button" class="btn ghost sm" data-act="openCats">Categories</button><button type="button" class="btn ghost sm" data-act="openBackup">Back up or restore</button><button type="button" class="btn ghost sm" data-act="loadSample">${ico('refresh')}Load example data</button><button type="button" class="btn ghost sm" data-act="startFresh" id="fresh">Delete everything and start fresh</button></div>${foot('Save settings')}</form>`}
  if(kind==='cats'){const own=state.core.cats||[];
    h=`<form class="modal cattools" data-form="cats" role="dialog" aria-modal="true" aria-labelledby="mt">${head('Categories')}
      ${fld('New category','name','text','','maxlength="24" placeholder="For example Pets, Gifts, Fuel" required autofocus autocomplete="off"')}
      <div class="fld"><span>Colour</span><div class="swatches">${NEW_COLORS.map((c,i)=>`<label style="--c:${c}"><input type="radio" name="color" value="${c}"${i===(CATS.length%NEW_COLORS.length)?' checked':''}><span></span></label>`).join('')}</div></div>
      <p class="err" id="merr" role="alert"></p><div class="mf"><button type="button" class="btn ghost" data-act="closeModal">Done</button><button class="btn" type="submit">Add category</button></div>
      <div class="hr" style="margin:14px 0 4px"></div><div><small style="color:var(--ink2);font-weight:700">YOUR CATEGORIES</small>${own.length?own.map(c=>`<div class="row" style="--c:${c.color}"><i></i><b>${esc(c.name)}</b><button type="button" class="btn ghost sm" data-act="removeCat" data-id="${c.id}">Remove</button></div>`).join(''):'<p style="margin:8px 0;color:var(--ink2);font-weight:600">None yet. Add one above.</p>'}
      <small style="display:block;margin-top:10px;color:var(--ink2);font-weight:600">Removing a category moves its expenses to Other. The ten built-in categories stay.</small></div></form>`}
  if(kind==='csv'){const rows=[['Date','Category','Note','Amount']].concat(monthItems(ui.month).slice().sort((a,b)=>a.d.localeCompare(b.d)).map(i=>[i.d,CAT[i.cat].name,i.note||'',i.amt]));
    const csv=rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n');
    h=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${head('Copy as CSV')}<p style="margin:0;color:var(--ink2);font-weight:600">${esc(mLabel(ui.month))}, paste into any spreadsheet.</p><textarea class="csv" id="csvbox" readonly>${esc(csv)}</textarea><div class="mf"><button type="button" class="btn ghost" data-act="closeModal">Close</button><button type="button" class="btn" data-act="copyCsv">${ico('copy')}Copy</button></div></div>`}
  if(kind==='backup'){h=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${head('Back up or restore')}<p style="margin:0;color:var(--ink2);font-weight:600">Your data lives only on this phone. Copy this text and keep it somewhere safe, such as Notes or an email to yourself.</p><textarea class="csv" id="bkbox" readonly>${esc(JSON.stringify(state))}</textarea><button type="button" class="btn" data-act="copyBackup">Copy backup</button><div class="hr"></div><p style="margin:0;color:var(--ink2);font-weight:600">To restore, paste a backup below. This replaces what is on this phone now.</p><textarea class="csv" id="rsbox" placeholder="Paste your backup here"></textarea><p class="err" id="merr" role="alert"></p><div class="mf"><button type="button" class="btn ghost" data-act="closeModal">Close</button><button type="button" class="btn" data-act="restoreBackup">Restore</button></div></div>`}
  const root=document.getElementById('modal');root.innerHTML=modalShell(h);
  const first=root.querySelector('[autofocus],input,textarea,button');if(first)first.focus();
}
function closeModal(){document.getElementById('modal').innerHTML=''}
function toast(msg,undo){
  const t=document.getElementById('toast');t.hidden=false;t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;
  toast.fn=undo;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true;toast.fn=null},6500)}

/* ---------- actions ---------- */
function setErr(m){const e=document.getElementById('merr');if(e)e.textContent=m}
function addCat(name){name=(name||'').trim().replace(/\s+/g,' ').slice(0,24);if(!name)return null;
  const ex=CATS.find(c=>c.name.toLowerCase()===name.toLowerCase());if(ex)return ex.id;
  const used=CATS.map(c=>c.color),color=NEW_COLORS.find(c=>used.indexOf(c)<0)||NEW_COLORS[CATS.length%NEW_COLORS.length];
  const c={id:'c'+uid(),name,color};state.core.cats=(state.core.cats||[]).concat([c]);buildCats(state.core.cats);touch('core');return c.id}
const catFrom=fd=>addCat(fd.get('newcat'))||fd.get('cat');
function addExpense(x){const m=monthOf(x.d);monthDoc(m).items.push(x);touch('exp_'+m)}
const FORMS={
  cats(fd){const name=(fd.get('name')||'').trim();if(!name){setErr('Type a name.');return}
    const ex=CATS.find(c=>c.name.toLowerCase()===name.toLowerCase());if(ex){setErr('You already have '+ex.name+'.');return}
    const color=fd.get('color')||NEW_COLORS[0],c={id:'c'+uid(),name:name.replace(/\s+/g,' ').slice(0,24),color};
    state.core.cats=(state.core.cats||[]).concat([c]);buildCats(state.core.cats);touch('core');openModal('cats');toast('Added '+c.name)},
  quick(fd,f){const amt=+fd.get('amt'),d=fd.get('d');if(!(amt>0)||!d)return;const cat=catFrom(fd)||'food';ui.lastCat=cat;f.reset();
    addExpense({id:uid(),d,amt:r2(amt),cat,note:(fd.get('note')||'').trim(),ts:Date.now()});toast('Added '+money(amt)+' to '+CAT[cat].name)},
  expense(fd,f){const amt=+fd.get('amt'),d=fd.get('d');if(!(amt>0)){setErr('Enter an amount above zero.');return}if(!d){setErr('Pick a date.');return}
    const cat=catFrom(fd);ui.lastCat=cat;const id=f.dataset.id;
    if(id){const x=findExpense(id);if(x){const nm=monthOf(d),names=['exp_'+x.m];if(nm!==x.m){state.exp[x.m].items.splice(x.i,1);monthDoc(nm).items.push(Object.assign(x.e,{d,amt:r2(amt),cat,note:(fd.get('note')||'').trim()}));names.push('exp_'+nm)}else Object.assign(x.e,{d,amt:r2(amt),cat,note:(fd.get('note')||'').trim()});closeModal();touch(...names);return}}
    closeModal();addExpense({id:uid(),d,amt:r2(amt),cat,note:(fd.get('note')||'').trim(),ts:Date.now()})},
  payment(fd,f){const amt=+fd.get('amt'),party=(fd.get('party')||'').trim();if(!party){setErr('Enter a name.');return}if(!(amt>0)){setErr('Enter an amount above zero.');return}
    const due=fd.get('due')||'',note=(fd.get('note')||'').trim(),id=f.dataset.id;
    if(id){const p=state.core.payments.find(x=>x.id===id);Object.assign(p,{party,amount:r2(amt),due,note});if(p.paid>p.amount)p.paid=p.amount}
    else state.core.payments.push({id:uid(),kind:f.dataset.kind,party,amount:r2(amt),paid:0,due,note,created:Date.now()});
    closeModal();touch('core')},
  pay(fd,f){const p=state.core.payments.find(x=>x.id===f.dataset.id),amt=+fd.get('amt');if(!(amt>0)){setErr('Enter an amount above zero.');return}
    const a=Math.min(r2(amt),rem(p)),names=['core'];p.paid=r2(p.paid+a);
    if(p.kind==='owe'&&fd.get('log')){const d=fd.get('d')||today(),m=monthOf(d);monthDoc(m).items.push({id:uid(),d,amt:a,cat:catFrom(fd)||'other',note:'Paid '+p.party,ts:Date.now()});names.push('exp_'+m)}
    closeModal();touch(...names);toast(p.kind==='owe'?'Payment recorded':'Received '+money(a))},
  investment(fd,f){const name=(fd.get('name')||'').trim(),inv=+fd.get('invested'),curV=+fd.get('current');if(!name){setErr('Enter a name.');return}if(!(inv>=0)||!(curV>=0)||fd.get('invested')===''||fd.get('current')===''){setErr('Enter what you put in and what it is worth today.');return}
    const o={name,type:fd.get('type'),invested:r2(inv),current:r2(curV),start:fd.get('start')||today(),sip:+fd.get('sip')||0,note:(fd.get('note')||'').trim()},id=f.dataset.id;
    if(id){const v=state.core.investments.find(x=>x.id===id),changed=v.current!==o.current;Object.assign(v,o);if(changed)pushHist(v,today(),o.current)}
    else state.core.investments.push(Object.assign({id:uid(),history:[[o.start,o.invested],[today(),o.current]].filter((h,i,a)=>i===a.length-1||h[0]!==a[a.length-1][0])},o));
    closeModal();touch('core')},
  invvalue(fd,f){const v=state.core.investments.find(x=>x.id===f.dataset.id),c=+fd.get('current');if(!(c>=0)||fd.get('current')===''){setErr('Enter what it is worth today.');return}
    v.invested=r2(v.invested+(+fd.get('extra')||0));v.current=r2(c);pushHist(v,fd.get('d')||today(),v.current);closeModal();touch('core')},
  settings(fd){const s=state.core.settings;s.currency=fd.get('currency');s.budget=+fd.get('budget')||0;closeModal();touch('core')}
};
function pushHist(v,d,val){v.history=v.history||[];const i=v.history.findIndex(h=>h[0]===d);if(i>=0)v.history[i][1]=val;else v.history.push([d,val]);v.history.sort((a,b)=>a[0].localeCompare(b[0]))}
const A={
  openBackup(){openModal('backup')},
  copyBackup(){const b=document.getElementById('bkbox');b.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard){navigator.clipboard.writeText(b.value).then(()=>toast('Backup copied'),()=>toast('Press and hold the text to copy it'));return}toast(ok?'Backup copied':'Press and hold the text to copy it')},
  restoreBackup(){const e=document.getElementById('merr');let o=null;try{o=JSON.parse(document.getElementById('rsbox').value.trim())}catch(x){}
    if(!(o&&o.core&&o.core.settings&&Array.isArray(o.core.payments))){e.textContent='That does not look like a backup from this app. Paste the whole text you copied.';return}
    state={core:o.core,exp:o.exp||{}};saveLocal();closeModal();touch(...docNames());toast('Backup restored')},
  nav(t){go(t.dataset.page)},
  mPrev(){ui.month=addMonths(ui.month,-1);ui.animate=true;render()},
  mNext(){ui.month=addMonths(ui.month,1);ui.animate=true;render()},
  mNow(){ui.month=monthOf(today());ui.animate=true;render()},
  openExpense(t){openModal('expense',{id:t.dataset.id})},
  openPayment(t){openModal('payment',{id:t.dataset.id,kind:t.dataset.kind})},
  openPay(t){openModal('pay',{id:t.dataset.id})},
  openInvestment(t){openModal('investment',{id:t.dataset.id})},
  openInvValue(t){openModal('invvalue',{id:t.dataset.id})},
  openSettings(){openModal('settings')},
  openCsv(){openModal('csv')},
  closeModal(){closeModal()},
  copyCsv(){const b=document.getElementById('csvbox');b.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(b.value).then(()=>toast('Copied to clipboard'),()=>toast('Press Ctrl+C to copy the selected text'));return}toast(ok?'Copied to clipboard':'Press Ctrl+C to copy the selected text')},
  filter(t){const c=t.dataset.cat;if(c==='all')ui.filterCats=[];else{const i=ui.filterCats.indexOf(c);if(i>=0)ui.filterCats.splice(i,1);else ui.filterCats.push(c);if(ui.filterCats.length>=CATS.length)ui.filterCats=[]}render()},
  openCats(){openModal('cats')},
  removeCat(t){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Tap again to remove';return}
    const id=t.dataset.id,names=['core'];state.core.cats=state.core.cats.filter(c=>c.id!==id);buildCats(state.core.cats);ui.filterCats=ui.filterCats.filter(x=>x!==id);
    Object.keys(state.exp).forEach(m=>{let ch=false;state.exp[m].items.forEach(i=>{if(i.cat===id){i.cat='other';ch=true}});if(ch)names.push('exp_'+m)});
    if(ui.lastCat===id)ui.lastCat='food';openModal('cats');touch(...names)},
  invFilter(t){ui.invType=t.dataset.type;render()},
  toggleSettled(t){ui.settled[t.dataset.kind]=!ui.settled[t.dataset.kind];render()},
  delExpense(t){const x=findExpense(t.dataset.id);if(!x)return;const item=x.e,m=x.m,i=x.i;state.exp[m].items.splice(i,1);touch('exp_'+m);
    toast('Expense deleted',()=>{monthDoc(m).items.splice(Math.min(i,monthDoc(m).items.length),0,item);touch('exp_'+m)})},
  delPayment(t){const a=state.core.payments,i=a.findIndex(p=>p.id===t.dataset.id);if(i<0)return;const [p]=a.splice(i,1);touch('core');toast('Deleted '+p.party,()=>{state.core.payments.splice(i,0,p);touch('core')})},
  delInvestment(t){const a=state.core.investments,i=a.findIndex(p=>p.id===t.dataset.id);if(i<0)return;const [v]=a.splice(i,1);touch('core');toast('Deleted '+v.name,()=>{state.core.investments.splice(i,0,v);touch('core')})},
  reopenPay(t){const p=state.core.payments.find(x=>x.id===t.dataset.id);p.paid=0;touch('core')},
  undo(){if(toast.fn)toast.fn();document.getElementById('toast').hidden=true;toast.fn=null},
  loadSample(){state.core=sampleCore();const ex=sampleExp();Object.keys(state.exp).forEach(m=>{if(!ex[m])ex[m]={items:[]}});state.exp=ex;closeModal();ui.month=monthOf(today());touch(...docNames())},
  startFresh(t){if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Tap again to delete everything';return}
    const s=state.core.settings,cc=state.core.cats||[];state.core=blankCore();state.core.settings=s;state.core.cats=cc;Object.keys(state.exp).forEach(m=>{state.exp[m]={items:[]}});closeModal();touch(...docNames())}
};
function go(p){if(PAGES.indexOf(p)<0)p='dashboard';ui.page=p;ui.animate=true;render();try{if(location.hash!=='#'+p)location.hash=p}catch(e){}window.scrollTo(0,0)}

/* ---------- render ---------- */
function render(){
  buildCats(state.core&&state.core.cats);
  const app=document.getElementById('app'),keep={},ae=document.activeElement;let sel=null;
  app.querySelectorAll('[data-keep]').forEach(e=>{keep[e.id]=e.value});
  if(ae&&ae.id&&app.contains(ae)){sel={id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}}
  const views={dashboard:viewDashboard,expenses:viewExpenses,payments:viewPayments,investments:viewInvestments};
  app.innerHTML=topbar()+(state.core.sample?`<div class="banner"><div class="wrap"><span>You are looking at example data.</span><button class="btn sm" data-act="startFresh">Clear it and start with my own</button></div></div>`:'')+`<main class="${ui.animate?'anim':''}"><div class="wrap">${views[ui.page]()}</div></main>`;
  ui.animate=false;
  app.querySelectorAll('[data-keep]').forEach(e=>{if(keep[e.id]!==undefined&&e.dataset.input!=='x')e.value=keep[e.id]});
  if(sel){const e=document.getElementById(sel.id);if(e){e.focus();try{e.setSelectionRange(sel.s,sel.e)}catch(x){}}}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.matches&&e.target.matches('[data-scrim]')){closeModal();return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=A[t.dataset.act];if(f){if(t.dataset.act==='startFresh'&&t.closest('#app')){state.core=Object.assign(blankCore(),{settings:state.core.settings,cats:state.core.cats||[]});Object.keys(state.exp).forEach(m=>{state.exp[m]={items:[]}});touch(...docNames());return}f(t,e)}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('modal').firstChild)closeModal();
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[role=link][data-act]'))e.target.click()});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(new FormData(f),f)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.input==='search'){ui.q=e.target.value;render()}});
document.addEventListener('change',e=>{if(e.target.name==='cat'&&e.target.closest('[data-form=quick]'))ui.lastCat=e.target.value});
window.addEventListener('hashchange',()=>{const p=location.hash.replace('#','');if(PAGES.indexOf(p)>=0&&p!==ui.page){ui.page=p;ui.animate=true;render()}});
const tip=document.getElementById('tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}
  tip.innerHTML=t.getAttribute('data-tip');tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+14,y=e.clientY-h-12;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+18;tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px'}
document.addEventListener('pointermove',showTip);document.addEventListener('pointerdown',showTip);
document.addEventListener('pointerleave',()=>{tip.hidden=true});window.addEventListener('scroll',()=>{tip.hidden=true},{passive:true});

/* ---------- start ---------- */
initState();
{const h=location.hash.replace('#','');if(PAGES.indexOf(h)>=0)ui.page=h}
render();
initCloud();
})();
</script>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
</script>
