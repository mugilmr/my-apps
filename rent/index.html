<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rent Roll">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="sheets-config.js"></script>
<title>Rent Roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a monthly rent roll. Solid colour tiles up top answer "how much is in, how much is out", property bands below show who is behind, and one tap records or chases each unit. */
:root{
  --ink:#0E1A3D; --ink2:#37466F; --muted:#66729A; --canvas:#EDF1FB; --card:#FFFFFF; --line:#DDE3F3; --soft:#F4F6FD;
  --royal:#3B5BFF; --mint:#22C38E; --amber:#FFB400; --tomato:#FF5A4F; --red:#D92D20; --violet:#7A5CFF; --sky:#1FA3FF; --magenta:#E6399B; --aqua:#00B8A9; --slate:#8B95B5;
  --display:'Unbounded',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px; --shadow:0 1px 0 rgba(14,26,61,.04),0 12px 28px -16px rgba(30,50,140,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--ink);font:600 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100%}
h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.02em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--royal);outline-offset:2px;border-radius:10px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.ico{width:18px;height:18px;flex:none}
.top{position:sticky;top:0;z-index:20;background:rgba(237,241,251,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font:800 17px var(--display);letter-spacing:-.03em;white-space:nowrap}
nav.tabs{display:flex;gap:4px;margin-left:8px;flex:1;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:99px;font-weight:800;color:var(--ink2);white-space:nowrap}
.tab:hover{background:rgba(59,91,255,.1)}
.tab[aria-current="page"]{background:var(--ink);color:#fff}
.sync{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.sync.saving i{background:var(--amber)}.sync.local i{background:var(--slate)}.sync.error i{background:var(--tomato)}
.icon{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon:hover{background:#E8EDFF}
.icon.sm{width:32px;height:32px;border-radius:10px}
.icon.danger:hover{background:#FFE3E0;color:var(--red)}
main{padding:22px 0 90px}
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
.phead h1{font-size:clamp(24px,4vw,36px);font-weight:800;line-height:1.1}
.eyebrow{display:block;font:800 12.5px var(--body);color:var(--muted);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase}
.sp{flex:1}
.mnav{display:flex;align-items:center;gap:6px}
.mnav .now{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 14px;height:38px;font-weight:800;min-width:150px}
.btn{border:0;background:var(--ink);color:#fff;border-radius:14px;padding:11px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{background:#1b2c5c}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:#E8EDFF}
.btn.royal{background:var(--royal)}.btn.royal:hover{background:#2c49e6}
.btn.green{background:var(--mint);color:var(--ink)}.btn.green:hover{background:#1cae7e}
.btn.wa{background:#25D366;color:#06311a}.btn.wa:hover{background:#1fbd5b}
.btn.sm{padding:7px 12px;border-radius:11px;font-size:13px}
.banner{background:var(--amber);color:var(--ink);padding:9px 0;font-weight:700}
.banner .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media (max-width:900px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch h2{font-size:16px;font-weight:700}.ch small{color:var(--muted);font-weight:700}.ch .sp{flex:1}
.scroll{overflow-x:auto}.scroll svg{min-width:520px}
svg.chart{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:700 11px var(--body)}.ax.now{fill:var(--ink);font-weight:800}
.vl{fill:var(--ink);font:800 11px var(--body)}
.hit{fill:transparent}.hit:hover{fill:rgba(14,26,61,.06)}
.exl{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 4}
.anim .seg{animation:grow .55s cubic-bezier(.2,.7,.2,1) backwards;transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{from{transform:scaleY(.05)}}
.modal.wide{width:min(640px,100%)}
.lg{border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.lgh{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}.lgh .lgn{margin-left:auto;font-weight:800}
.lgp{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13.5px;font-weight:700;color:var(--ink2);padding-left:10px;border-left:3px solid var(--line)}
.lgp.bal{color:#8c1d14;border-color:var(--red)}.lgp.ex{border-color:var(--amber)}.lgp.pd{border-color:var(--mint)}
.alr{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.alr small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.alr input{border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font-weight:800;text-align:right;width:100%}
.hint.bad{color:var(--red)}
.tcard{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--ink2);font-size:13px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:4px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:16px}
.tile{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-height:140px}
.tile::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);pointer-events:none}
.tile .lbl{font-weight:800;font-size:12.5px;letter-spacing:.02em;opacity:.92}
.tile b.num{font:800 clamp(22px,2.6vw,28px)/1.15 var(--display);letter-spacing:-.03em}
.tile .sub{margin:0;font-weight:700;font-size:13px;opacity:.95}
.tile[role=link]{cursor:pointer;transition:transform .15s}.tile[role=link]:hover{transform:translateY(-3px)}
.t-royal{background:var(--royal);color:#fff}.t-mint{background:var(--mint);color:var(--ink)}.t-amber{background:var(--amber);color:var(--ink)}
.t-tomato{background:var(--tomato);color:var(--ink)}.t-violet{background:var(--violet);color:#fff}.t-sky{background:var(--sky);color:var(--ink)}
.tile .ringw{position:absolute;right:12px;top:12px;width:64px;height:64px;z-index:1}
.tile .big{font:800 36px var(--display)}

/* status chips */
.st{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:800;white-space:nowrap}
.st .ico{width:14px;height:14px}
.st.paid{background:#D7F6E9;color:#0A6B47}.st.partial{background:#FFEDB8;color:#7A5200}.st.overdue{background:var(--red);color:#fff}
.st.soon{background:#D8EEFF;color:#0B5A94}.st.up{background:#E7EBF8;color:var(--ink2)}.st.vac{background:#E7EBF8;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12.5px;font-weight:800;background:color-mix(in srgb,var(--c) 17%,#fff);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* property cards on dashboard */
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.pc{border-radius:var(--r);padding:16px 18px;background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:var(--shadow);border-top:8px solid var(--c);display:flex;flex-direction:column;gap:8px}
.pc .top2{display:flex;gap:12px;align-items:center}
.pbadge{width:44px;height:44px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.pbadge svg{width:26px;height:26px}
.pc h3{font-size:15px;font-weight:700}
.pc small{color:var(--ink2);font-weight:700}
.bar{height:12px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,#fff);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:99px}
.pc .nums{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:13.5px;flex-wrap:wrap}

/* lists */
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .badge{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 22%,#fff);display:grid;place-items:center}
.li .t{font-weight:800;overflow-wrap:anywhere}.li .s{font-size:13px;color:var(--muted);font-weight:700}
.li .a{font-weight:800;text-align:right;white-space:nowrap}.li .a small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.li .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.empty{color:var(--muted);font-weight:700;padding:16px 0;text-align:center}
.cl{display:flex;flex-direction:column;gap:7px;font-size:13.5px;font-weight:700;margin-top:6px}
.cl div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.cl i{width:12px;height:12px;border-radius:4px}.cl em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.dw svg.chart{max-width:230px;margin:0 auto}.dw{display:grid;grid-template-columns:minmax(140px,190px) 1fr;gap:14px;align-items:center}
@media (max-width:520px){.dw{grid-template-columns:1fr}}

/* collect page */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.fchip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff}
.search{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;min-width:200px;font-weight:700}
.alert{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#FFE8E5;border:1px solid #FFC6C0;color:#7a1410;border-radius:16px;padding:12px 16px;margin-bottom:16px;font-weight:700}
.alert button{margin-left:auto}
.psec{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.psh{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;background:color-mix(in srgb,var(--c) 14%,#fff);border-left:10px solid var(--c)}
.psh h2{font-size:15px;font-weight:700}.psh small{color:var(--ink2);font-weight:700}
.psh .prog{min-width:180px;display:flex;flex-direction:column;gap:5px;text-align:right;font-weight:800;font-size:13px}
@media (max-width:620px){.psh{grid-template-columns:auto 1fr}.psh .prog{grid-column:1/-1;text-align:left}}
.urow{display:grid;grid-template-columns:8px minmax(130px,1fr) minmax(190px,1fr) 170px 330px;gap:6px 14px;align-items:center;padding:12px 16px 12px 0;border-top:1px solid var(--line)}
.urow .stripe{align-self:stretch;background:var(--sc);border-radius:0 6px 6px 0}
.urow .un{font-weight:800;overflow-wrap:anywhere}.urow .un small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.urow .amt{font-weight:800}.urow .amt small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.urow .ar{grid-column:2/-1;font-size:13px;font-weight:700;background:#FFF1EF;color:#8c1d14;border-radius:10px;padding:6px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.urow .rm{grid-column:2/-1;font-size:12.5px;color:var(--muted);font-weight:700}
.urow.isvac .un{color:var(--ink2)}
.urow.paidrow{background:linear-gradient(90deg,rgba(34,195,142,.07),transparent 40%)}
@media (max-width:1020px){.urow{grid-template-columns:8px 1fr auto;padding-right:12px}.urow .amt{grid-column:2}.urow .stc{grid-column:3;grid-row:1}.urow .acts{grid-column:2/-1;justify-content:flex-start}}

/* properties page */
.pg{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.pgh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 18px;background:color-mix(in srgb,var(--c) 14%,#fff);border-left:10px solid var(--c)}
.pgh h2{font-size:16px;font-weight:700}.pgh small{color:var(--ink2);font-weight:700;display:block}
.pgh .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pstats{display:flex;gap:6px 22px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);font-weight:700;color:var(--ink2);font-size:13.5px}
.pstats b{color:var(--ink);font-size:15px}
.unr{display:grid;grid-template-columns:minmax(80px,.6fr) minmax(150px,1.4fr) minmax(100px,.8fr) auto;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--line)}
.unr:first-of-type{border-top:0}
.unr .lbl{font-weight:800}.unr .tn{font-weight:700;overflow-wrap:anywhere}.unr .tn small{display:block;color:var(--muted);font-size:12.5px}
.unr .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:700px){.unr{grid-template-columns:1fr auto}.unr .tn{grid-column:1/-1;order:3}}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:12px}
.stats div{display:flex;flex-direction:column;font-size:12px;font-weight:800;color:var(--muted)}
.stats b{font:800 18px var(--display);color:var(--ink)}

/* modal etc */
.scrim{position:fixed;inset:0;background:rgba(14,26,61,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:24px;width:min(520px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px -20px rgba(14,26,61,.6);max-height:calc(100% - 16px);overflow:auto}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px}.mh h2{font-size:19px;font-weight:800}
.mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px;color:var(--ink2);min-width:0}
.fld i{font-style:normal;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px rgba(59,91,255,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pickgrp{display:flex;gap:6px;flex-wrap:wrap}
.pick{position:relative;cursor:pointer}.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pick span{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);font-weight:800;font-size:13.5px;background:#fff}
.pick input:checked + span{background:var(--ink);border-color:var(--ink);color:#fff}
.pick input:focus-visible + span{outline:3px solid var(--royal);outline-offset:2px}
.sw span{width:34px;height:34px;padding:0;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw input:checked + span{background:var(--c);border-color:#fff;box-shadow:0 0 0 3px var(--ink)}
.err{color:var(--red);font-weight:800;margin:0}
.hint{margin:0;color:var(--muted);font-weight:700;font-size:13px}
.hr{height:1px;background:var(--line)}
.csv{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:500 12px/1.4 ui-monospace,Menlo,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:#fff;padding:11px 14px 11px 18px;border-radius:14px;font-weight:700;box-shadow:0 14px 40px -10px rgba(14,26,61,.7);max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
#toast button,#toast a{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:5px 11px;font-weight:800;text-decoration:none}
#toast a{background:#25D366;color:#06311a}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.5;font-weight:700;box-shadow:0 12px 30px -8px rgba(14,26,61,.6);max-width:240px}
#tip[hidden]{display:none}
@media (max-width:640px){.tiles{grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:112px;padding:14px}.tile .ringw{width:50px;height:50px;right:8px;top:8px}.tile .sub{font-size:12px}.tab{padding:8px 11px;font-size:14px}.rc .tx{display:none}.rc{padding:7px 10px}.top .wrap{flex-wrap:wrap;padding-top:8px;padding-bottom:8px;gap:8px}.brand{flex:1}nav.tabs{order:3;width:100%;flex:none;margin:0}.wrap{padding:0 14px}.sync span{display:none}}
/* iPhone app polish */
input,select,textarea{font-size:16px!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,.btn,.tab,.icon,.fchip{touch-action:manipulation}
.top{padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
#toast{bottom:calc(22px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" hidden></div>
<div id="tip" hidden></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PAGES=['dashboard','collect','properties','log'];
const PTYPES=[{id:'apartment',name:'Apartment',unit:'Flat'},{id:'hotel',name:'Hotel',unit:'Whole building'},{id:'factory',name:'Factory',unit:'Whole factory'},{id:'shop',name:'Shop or office',unit:'Shop'},{id:'house',name:'House',unit:'House'},{id:'land',name:'Land or other',unit:'Plot'}];

/* Merge what the shared copy has. Documents with unsynced local edits are kept (local wins and gets uploaded). */
function applyRemote(docs,first,remoteEmpty){
  const names=Object.keys(docs);
  if(first){
    if(remoteEmpty||!names.length){docNames().forEach(n=>dirty.add(n));saveDirty();setSync('saving');flush();return}
    const keep={};dirty.forEach(n=>{const d=getDoc(n);if(d)keep[n]=d});
    state={core:null,pay:{}};names.forEach(n=>{if(!keep[n])setDoc(n,docs[n])});Object.keys(keep).forEach(n=>setDoc(n,keep[n]));
    if(!state.core)state.core=blankCore();saveLocal();render();if(dirty.size)flush();return}
  let changed=false;
  names.forEach(n=>{if(dirty.has(n))return;if(!same(getDoc(n),docs[n])){setDoc(n,docs[n]);changed=true}});
  if(!state.core)state.core=blankCore();

const items=m=>state.pay[m]?state.pay[m].items:[];
const rems=m=>state.pay[m]?state.pay[m].rem:[];
/* A tenant is billed from the later of their move-in month and the "track from" month, up to the month they left (the leaving month is billed only if they left on or after the due day). */
const firstMonth=t=>{const s=monthOf(t.start);return t.track&&t.track>s?t.track:s};
const lastMonth=t=>{if(!t.end)return null;const e=monthOf(t.end);return parse(t.end).getDate()>=(t.dueDay||1)?e:addMonths(e,-1)};
function tenAt(u,m){
  const c=u.tens.filter(t=>firstMonth(t)<=m&&(!lastMonth(t)||m<=lastMonth(t)));if(c.length<2)return c[0]||null;
  const at=t=>{const dd=dueDate(t,m);return t.start<=dd&&(!t.end||t.end>=dd)?1:0};
  return c.sort((a,b)=>(at(b)-at(a))||b.start.localeCompare(a.start))[0]}
const curTen=u=>u.tens.filter(t=>!t.end||t.end>today()).sort((a,b)=>b.start.localeCompare(a.start))[0]||null;
function rentFor(t,m){let r=t.rents.length?t.rents[0].rent:0;t.rents.slice().sort((a,b)=>a.from.localeCompare(b.from)).forEach(x=>{if(x.from<=m)r=x.rent});return r}
const dueDate=(t,m)=>m+'-'+pad(Math.min(Math.max(1,t.dueDay||1),dim(m)));
const chgs=m=>(state.pay[m]&&state.pay[m].chg)||[];
const lastTen=u=>u.tens.slice().sort((a,b)=>a.start.localeCompare(b.start)).pop()||null;
function tenFor(u,m){let c=null;u.tens.slice().sort((a,b)=>a.start.localeCompare(b.start)).forEach(t=>{if(monthOf(t.start)<=m)c=t});return c||lastTen(u)}
/* A month's amount due = the tenant's rent for that month + any "carried forward" amounts added for it. Payments can be spread over months, so a month may be part paid. */
function rowFor(p,u,m){
  let t=tenAt(u,m);const ch=chgs(m).filter(x=>x.u===u.id),extra=r2(sum(ch,x=>x.amt));let opening=false;
  if(!t){if(!ch.length)return null;t=tenFor(u,m);if(!t)return null;opening=true}
  const base=opening?0:rentFor(t,m),due=r2(base+extra),dd=dueDate(t,m),its=items(m).filter(x=>x.u===u.id).sort((a,b)=>a.d.localeCompare(b.d)||(a.ts||0)-(b.ts||0)),paid=r2(sum(its,x=>x.amt)),bal=Math.max(0,r2(due-paid)),td=today();
  const late=bal>0.004&&td>dd,dl=late?dayDiff(dd,td):0;
  let st='up';if(bal<=0.004)st='paid';else if(paid>0)st='partial';else if(late)st='overdue';else if(m<=monthOf(td)&&dayDiff(td,dd)<=3)st='soon';
  return{p,u,t,m,due,base,extra,ch,opening,dd,its,last:its[its.length-1]||null,paid,bal,late,dl,st,rem:rems(m).filter(x=>x.u===u.id)}}
function monthRows(m){const o=[];state.core.props.forEach(p=>p.units.forEach(u=>{const r=rowFor(p,u,m);if(r)o.push(r)}));return o}
function vacants(m){if(m<monthOf(today()))return[];const o=[];state.core.props.forEach(p=>p.units.forEach(u=>{if(!curTen(u))o.push({p,u})}));return o}
function summary(rows){const exp=sum(rows,r=>r.due),col=sum(rows,r=>r.paid),bal=sum(rows,r=>r.bal);return{exp,col,bal,n:rows.length,paidN:rows.filter(r=>r.st==='paid').length,late:rows.filter(r=>r.late),lateAmt:sum(rows.filter(r=>r.late),r=>r.bal)}}
function arrearsList(before){
  const cm=before||monthOf(today()),out=[];
  allUnits().forEach(({p,u})=>{const months=[];for(let n=24;n>=1;n--){const m=addMonths(cm,-n),r=rowFor(p,u,m);if(r&&r.bal>0.004)months.push(r)}
    if(months.length)out.push({p,u,t:months[months.length-1].t,months,total:sum(months,x=>x.bal)})});
  return out.sort((a,b)=>b.total-a.total)}
const arrearsOf=(uid2,before)=>{const a=arrearsList(before).find(x=>x.u.id===uid2);return a||null};

function payCands(id){const f=findUnit(id);if(!f)return[];const cm=monthOf(today()),out=[];
  for(let n=24;n>=0;n--){const r=rowFor(f.p,f.u,addMonths(cm,-n));if(r&&r.bal>0.004)out.push(r)}
  for(let n=1;n<=12;n++){const r=rowFor(f.p,f.u,addMonths(cm,n));if(r&&r.bal>0.004)out.push(r)}
  return out}
function autoAlloc(id,amt,pref){const c=payCands(id),ord=c.slice();if(pref){const i=ord.findIndex(r=>r.m===pref);if(i>0)ord.unshift(ord.splice(i,1)[0])}
  let left=r2(amt);const res={};ord.forEach(r=>{if(left<=0.004)return;const a=Math.min(left,r.bal);res[r.m]=r2(a);left=r2(left-a)});
  if(left>0.004){const k=Object.keys(res).sort().pop()||pref||monthOf(today());res[k]=r2((res[k]||0)+left)}

const grpItems=g=>Object.values(state.pay).flatMap(d=>d.items.filter(i=>i.grp===g));

  Object.values(state.pay).forEach(d=>d.items.forEach(i=>{if(keep&&!keep(i))return;const f=findUnit(i.u);if(!f)return;const k=i.grp||i.id;let e=map.get(k);
    if(!e){e={k:'pay',key:k,d:i.d,ts:i.ts||0,items:[],amt:0,mode:i.mode,note:i.note||'',p:f.p,u:f.u};map.set(k,e)}e.items.push(i);e.amt=r2(e.amt+i.amt)}));
  const out=[...map.values()];out.forEach(e=>{e.items.sort((a,b)=>a.m.localeCompare(b.m));e.t=tenAt(e.u,e.items[0].m)||lastTen(e.u)});
  return out.sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts)}
function findUnit(id){for(const p of state.core.props){const u=p.units.find(x=>x.id===id);if(u)return{p,u}}return null}

/* ---------- messages ---------- */
function receiptGrp(its){const f=findUnit(its[0].u);if(!f)return'';const tn=tenAt(f.u,its[0].m)||lastTen(f.u),tot=r2(sum(its,i=>i.amt)),o=owedMap()[f.u.id]||0,
  what=its.length>1?'towards rent for '+its.map(i=>mShort(i.m)+' '+money(i.amt)).join(', '):'towards the rent for '+mLabel(its[0].m);
  return `Hello ${tn.name}, we have received ${money(tot)} on ${fmtShort(its[0].d)} (${its[0].mode}) for ${f.u.label}, ${f.p.name}, ${what}. ${o>0.004?'Balance still pending: '+money(o)+'.':'No rent is pending now.'} Thank you.${sig()}`}
function waLink(phone,msg){let n=String(phone||'').replace(/\D/g,'');if(!n)return'';if(n.length===10)n=(state.core.settings.cc||'91')+n;else if(n.length===11&&n[0]==='0')n=(state.core.settings.cc||'91')+n.slice(1);return'https://wa.me/'+n+'?text='+encodeURIComponent(msg)}
const sig=()=>state.core.settings.landlord?'\n'+state.core.settings.landlord:'';
const remindMsg=r=>{const tot=owedMap()[r.u.id]||0;return `Hello ${r.t.name}, this is a reminder that the rent for ${r.u.label}, ${r.p.name} for ${mLabel(r.m)} is pending. Amount due: ${money(r.bal)}. It was due on ${fmtShort(r.dd)}.${tot>r.bal+0.004?' Total pending including earlier months: '+money(tot)+'.':''} Please pay at your earliest and share the payment details here. Thank you.${sig()}`};
const receiptMsg=(r,it)=>`Hello ${r.t.name}, we have received ${money(it.amt)} on ${fmtShort(it.d)} (${it.mode}) towards the rent of ${r.u.label}, ${r.p.name} for ${mLabel(r.m)}. ${r.bal>0.004?'Balance pending: '+money(r.bal)+'.':'Your rent for this month is fully paid.'} Thank you.${sig()}`;

/* ---------- charts ---------- */
const tipAttr=h=>` data-tip="${esc(h)}"`;
function donut(entries,top,sub,label){
  const total=sum(entries,e=>e.value),S=220,R=82,W=30,C=2*Math.PI*R,cx=S/2;
  let s=`<svg class="chart" viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(label)}"><circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="#EDF0FA" stroke-width="${W}"/>`;
  if(total>0){let acc=0;const gap=entries.length>1?2.5:0;
    entries.forEach(e=>{const len=e.value/total*C;if(len<=0)return;const l2=Math.max(.5,len-gap);
      s+=`<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${e.color}" stroke-width="${W}" stroke-dasharray="${l2} ${C-l2}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cx})"${tipAttr('<b>'+esc(e.label)+'</b><br>'+money(e.value)+' · '+pct(e.value/total)+'%')}/>`;acc+=len})}
  return s+`<text x="${cx}" y="${cx+2}" text-anchor="middle" style="font:800 22px var(--display);fill:var(--ink)">${esc(top)}</text><text x="${cx}" y="${cx+22}" text-anchor="middle" class="ax">${esc(sub)}</text></svg>`}
function ringSvg(p,color,track){const R=30,C=2*Math.PI*R;return `<svg viewBox="0 0 74 74" class="ringw" role="img" aria-label="${pct(p)} percent collected"><circle cx="37" cy="37" r="${R}" fill="none" stroke="${track}" stroke-width="9"/><circle cx="37" cy="37" r="${R}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*Math.min(1,p)} ${C}" transform="rotate(-90 37 37)"/><text x="37" y="42" text-anchor="middle" style="font:800 15px var(--display);fill:${color}">${pct(p)}%</text></svg>`}
function trendChart(end){
  const ms=[];for(let i=11;i>=0;i--)ms.push(addMonths(end,-i));

    s+=`<rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${ph}"${tipAttr(tip)}/><text class="ax${d.m===end?' now':''}" x="${x+barw/2}" y="${H-8}" text-anchor="middle">${mShort(d.m)}</text>`});

function slowPayers(){
  const cm=monthOf(today()),out=[];
  allUnits().forEach(({p,u})=>{const t0=tenAt(u,cm);if(!t0)return;let n=0,tot=0,unpaid=0;
    for(let k=1;k<=6;k++){const m=addMonths(cm,-k),r=rowFor(p,u,m);if(!r||r.t.id!==t0.id)continue;
      if(r.bal>0.004){unpaid++;continue}
      let cum=0,done=null;r.its.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(i=>{cum+=i.amt;if(done==null&&cum>=r.due-.005)done=i.d});
      if(done){n++;tot+=Math.max(0,dayDiff(r.dd,done))}}
    if(n+unpaid>=3){const avg=n?tot/n:0;if(avg>=1||unpaid)out.push({p,u,t:t0,avg,unpaid,score:avg+unpaid*15})}});
  return out.sort((a,b)=>b.score-a.score).slice(0,5)}

  openLedger(t){openModal('ledger',{u:t.dataset.u})},openHist(t){openModal('hist',{u:t.dataset.u})},openChg(t){openModal('chg',{u:t.dataset.u})},rentHist(t){openModal('rent',{u:t.dataset.u,t:t.dataset.t})},newTen(t){openModal('unit',{u:t.dataset.u,fresh:1})},
  markPaid(t){const f=findUnit(t.dataset.u),r=f&&rowFor(f.p,f.u,t.dataset.m);if(!r||r.bal<=0.004)return;afterPays([addPayment(r.u.id,r.m,r.bal,today(),state.core.settings.mode||'UPI','')])},
  reminded(t){const f=findUnit(t.dataset.u);if(!f)return;const m=t.dataset.m;payDoc(m).rem.push({id:uid(),u:t.dataset.u,m,ts:Date.now()});quiet('pay_'+m);setTimeout(render,400)},
  delPays(t){const rm=[];t.dataset.ids.split(',').forEach(x=>{const [id,m]=x.split('@'),y=removePayment(id,m);if(y)rm.push({m,it:y.it})});if(!rm.length)return;closeModal();const ms=[...new Set(rm.map(r=>'pay_'+r.m))];
    touch(...ms);toast('Payment deleted',()=>{rm.forEach(r=>payDoc(r.m).items.push(r.it));touch(...ms)})},
  delChg(t){const m=t.dataset.m,a=payDoc(m).chg,i=a.findIndex(c=>c.id===t.dataset.id);if(i<0)return;const [c]=a.splice(i,1);closeModal();touch('pay_'+m);toast('Pending amount removed',()=>{payDoc(m).chg.push(c);touch('pay_'+m)})},
  delRent(t){const x=findUnit(t.dataset.u),tn=x&&x.u.tens.find(y=>y.id===t.dataset.t);if(!tn||tn.rents.length<2)return;tn.rents=tn.rents.filter(r=>r.from!==t.dataset.from);touch('core');openModal('rent',{u:t.dataset.u,t:t.dataset.t})},
  newProp(){openModal('prop')},editProp(t){openModal('prop',{p:t.dataset.p})},addUnits(t){openModal('units',{p:t.dataset.p})},
  editUnit(t){openModal('unit',{u:t.dataset.u,t:t.dataset.t,fresh:t.dataset.fresh})},vacate(t){openModal('vacate',{u:t.dataset.u})},
  delProp(t){const a=state.core.props,i=a.findIndex(p=>p.id===t.dataset.p);if(i<0)return;const [p]=a.splice(i,1);touch('core');toast('Deleted '+p.name,()=>{state.core.props.splice(i,0,p);touch('core')})},
  delUnit(t){const f=findUnit(t.dataset.u);if(!f)return;const i=f.p.units.findIndex(u=>u.id===f.u.id),[u]=f.p.units.splice(i,1),pid=f.p.id;touch('core');toast('Deleted '+u.label,()=>{const p=state.core.props.find(x=>x.id===pid);if(p){p.units.splice(i,0,u);touch('core')}})},
  filter(t){ui.filter=t.dataset.f;render()},propf(t){ui.prop=t.dataset.p;render()},
  goArrears(){ui.filter='arrears';ui.prop='all';ui.q='';ui.month=monthOf(today());go('collect')},
  goVacant(){ui.filter='vacant';ui.prop='all';ui.q='';go('collect')},
  logType(t){ui.logType=t.dataset.k;render()},logAll(){ui.logAll=!ui.logAll;render()},
  signOut(){stopPoll();localStorage.removeItem(PASS_KEY);closeModal();setSync('local');showLogin()},
  reportNow(){closeModal();if(sheetsOn()&&cloud)sApi('report',{tabs:buildReports()}).then(()=>toast('Google Sheet tabs updated')).catch(()=>toast('Could not update the sheet. Check your internet.'))},
  loadStarter(){if(state.core.props.length)return;const d=starterData();state.core.props=d.core.props;state.core.starter=true;ui.page='properties';touch('core')},
  dismissStarter(){state.core.starter=false;touch('core')},
  openSettings(){openModal('settings')},openCsv(){openModal('csv')},openBackup(){openModal('backup')},closeModal(){closeModal()},
  copyCsv(){copyBox('csvbox','Copied to clipboard')},copyBackup(){copyBox('bkbox','Backup copied')},
  restoreBackup(){const e=document.getElementById('merr');let o=null;try{o=JSON.parse(document.getElementById('rsbox').value.trim())}catch(x){}
    if(!(o&&o.core&&Array.isArray(o.core.props))){e.textContent='That does not look like a backup from this app. Paste the whole text you copied.';return}
    state={core:o.core,pay:o.pay||{}};saveLocal();closeModal();touch(...docNames());toast('Backup restored')},
  undo(){if(toast.fn)toast.fn();document.getElementById('toast').hidden=true;toast.fn=null},
  loadSample(){state=sampleData();closeModal();ui.month=monthOf(today());touch(...docNames())},
  startFresh(t){if(t.closest('#modal')&&t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Tap again to delete everything';return}
    const old=Object.keys(state.pay),s=state.core.settings;state={core:blankCore(),pay:{}};state.core.settings=s;old.forEach(m=>{state.pay[m]={items:[],rem:[]}});closeModal();touch(...docNames())}};
function copyBox(id,msg){const b=document.getElementById(id);b.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(b.value).then(()=>toast(msg),()=>toast('Press and hold the text to copy it'));return}toast(ok?msg:'Press and hold the text to copy it')}
function go(p){if(PAGES.indexOf(p)<0)p='dashboard';ui.page=p;ui.animate=true;render();try{if(location.hash!=='#'+p)location.hash=p}catch(e){}window.scrollTo(0,0)}

/* ---------- render + events ---------- */
function render(){
  _owed=null;
  const app=document.getElementById('app'),keep={},ae=document.activeElement;let sel=null;
  app.querySelectorAll('[data-keep]').forEach(e=>{keep[e.id]=e.value});
  if(ae&&ae.id&&app.contains(ae))sel={id:ae.id,s:ae.selectionStart,e:ae.selectionEnd};
  const v={dashboard:viewDashboard,collect:viewCollect,properties:viewProperties,log:viewLog};
  app.innerHTML=topbar()+(state.core.starter?`<div class="banner"><div class="wrap"><span>Your properties and rents are loaded. Tap a property to add tenant names, phone numbers and advances.</span><button class="btn sm" data-act="dismissStarter">Got it</button></div></div>`:'')+(state.core.sample?`<div class="banner"><div class="wrap"><span>You are looking at example data.</span><button class="btn sm" data-act="startFresh">Clear it and add my properties</button></div></div>`:'')+`<main class="${ui.animate?'anim':''}"><div class="wrap">${v[ui.page]()}</div></main>`;
  ui.animate=false;
  app.querySelectorAll('[data-keep]').forEach(e=>{if(keep[e.id]!==undefined)e.value=keep[e.id]});
  if(sel){const e=document.getElementById(sel.id);if(e){e.focus();try{e.setSelectionRange(sel.s,sel.e)}catch(x){}}}}
document.addEventListener('click',e=>{
  if(e.target.matches&&e.target.matches('[data-scrim]')){closeModal();return}
  const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];
  if(f){if(t.dataset.act==='startFresh'&&t.closest('#app')){const s=state.core.settings,old=Object.keys(state.pay);state={core:blankCore(),pay:{}};state.core.settings=s;old.forEach(m=>{state.pay[m]={items:[],rem:[]}});touch(...docNames());return}f(t,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').firstChild&&!document.querySelector('[data-form=login]'))closeModal();if(e.key==='Enter'&&e.target.matches&&e.target.matches('[role=link][data-act]'))e.target.click()});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(new FormData(f),f,e.submitter)});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.input==='search'){ui.q=e.target.value;render();return}
  const f=e.target.closest&&e.target.closest('[data-form=pay]');if(f){if(e.target.name==='amt')renderAlloc(f);else if(e.target.name&&e.target.name.indexOf('al_')===0)updLeft(f)}});
document.addEventListener('change',e=>{
  const f=e.target.closest&&e.target.closest('[data-form=pay]');
  if(f&&e.target.name==='u'){f.dataset.pref='';renderAlloc(f)}
  if(e.target.id==='ptype'){const p=document.getElementById('pprefix');if(p)p.value=PT[e.target.value].unit}});
window.addEventListener('hashchange',()=>{const p=location.hash.replace('#','');if(PAGES.indexOf(p)>=0&&p!==ui.page){ui.page=p;ui.animate=true;render()}});
const tip=document.getElementById('tip');
function showTip(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}
  tip.innerHTML=t.getAttribute('data-tip');tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-12;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+18;tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px'}
document.addEventListener('pointermove',showTip);document.addEventListener('pointerdown',showTip);window.addEventListener('scroll',()=>{tip.hidden=true},{passive:true});

initState();
{const h=location.hash.replace('#','');if(PAGES.indexOf(h)>=0)ui.page=h}
render();
initCloud();
})();
